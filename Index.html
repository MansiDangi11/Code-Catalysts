<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MindBloom</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:linear-gradient(160deg,#180018,#563e76);

    color:#FAE5D8;

    font-family:'Poppins',sans-serif;

    min-height:100vh;

    overflow:hidden;

}

/* ---------------- MAIN SECTION ---------------- */

.hero{

    width:92%;

    height:92vh;

    margin:4vh auto;

    border:1px solid rgba(250,229,216,.08);

    border-radius:40px;

    position:relative;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    background:rgba(255,255,255,.02);

    backdrop-filter:blur(6px);

}

/* ---------------- Decorative Glow ---------------- */

.hero::before{

    content:"";

    position:absolute;

    width:600px;

    height:600px;

    background:#824D69;

    filter:blur(180px);

    opacity:.18;

    top:-220px;

    right:-180px;

    border-radius:50%;

}

.hero::after{

    content:"";

    position:absolute;

    width:450px;

    height:450px;

    background:#522959;

    filter:blur(150px);

    opacity:.15;

    bottom:-180px;

    left:-120px;

    border-radius:50%;

}

/* ---------------- Logo ---------------- */

.logo{

    position:absolute;

    top:45px;

    left:60px;

    font-size:15px;

    letter-spacing:6px;

    color:#DFB6B2;

}

/* ---------------- Tiny Moon ---------------- */

.moon{

    position:absolute;

    top:60px;

    right:95px;

    font-size:75px;

    opacity:.8;

}

/* ---------------- Heading ---------------- */

h1{

    font-family:'Cormorant Garamond',serif;

    font-size:6rem;

    font-weight:600;

    margin-bottom:10px;

    letter-spacing:2px;

}

.subtitle{

    color:#DFB6B2;

    font-size:1.2rem;

    margin-bottom:60px;

}

/* ---------------- Reminder ---------------- */

.reminder{

    text-transform:uppercase;

    letter-spacing:5px;

    font-size:.8rem;

    color:#DFB6B2;

    margin-bottom:25px;

}

/* ---------------- Quote ---------------- */

.quote{

    width:700px;

    font-family:'Cormorant Garamond',serif;

    font-size:2rem;

    line-height:1.6;

    color:#FAE5D8;

    margin-bottom:70px;

}

/* ---------------- Button ---------------- */

.begin-btn{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    padding:18px 48px;

    background:#824D69;

    color:#FAE5D8;

    border-radius:50px;

    text-decoration:none;

    font-size:1rem;

    font-weight:600;

    transition:all .35s ease;

    box-shadow:0 12px 25px rgba(24,0,24,.25);

}

.begin-btn:hover{

    background:#DFB6B2;

    color:#180018;

    transform:translateY(-5px) scale(1.02);

    box-shadow:0 18px 35px rgba(24,0,24,.3);

}

/* ---------------- Doodles ---------------- */

.line-top{

    position:absolute;

    top:130px;

    left:120px;

    width:220px;

    border-top:2px solid rgba(223,182,178,.2);

    transform:rotate(-8deg);

}

.line-bottom{

    position:absolute;

    bottom:110px;

    right:120px;

    width:250px;

    border-top:2px solid rgba(223,182,178,.2);

    transform:rotate(10deg);

}

.star1{

    position:absolute;

    left:18%;

    top:24%;

    color:#DFB6B2;

    opacity:.35;

}

.star2{

    position:absolute;

    right:22%;

    bottom:22%;

    color:#DFB6B2;

    opacity:.35;

}

a{
    text-decoration:none;
}

</style>

</head>

<body>

<div class="hero">

<div class="logo">MINDBLOOM</div>

<div class="moon">☾</div>

<div class="line-top"></div>
<div class="line-bottom"></div>

<div class="star1">✦</div>
<div class="star2">✦</div>

<h1>Welcome Home.</h1>

<p class="subtitle">
A quiet place for thoughts that deserve to be heard.
</p>

<p class="reminder">
Today's Reminder
</p>

<div class="quote">

“The world has been loud enough today.<br>
Take a deep breath.<br>
Let's make a little room for you.”

</div>

<a href="Dashboard.html" class="begin-btn">
    ✦ Begin Reflection
</a>


</body>

</html>
