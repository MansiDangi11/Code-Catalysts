<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MindBloom | Welcome</title>

    <link rel="stylesheet" href="auth.css">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

</head>


<body>


<div class="auth-page">


    <div class="auth-card">


        <div class="bloom">
            🌸
        </div>


        <h1>
            Welcome Home.
        </h1>


        <p class="subtitle">
            A quiet space for thoughts that deserve to be heard.
        </p>


        <div class="auth-toggle">

    <button class="active" id="loginTab">
        Login
    </button>

    <button id="signupTab">
        Sign Up
    </button>

</div>



        <div class="form">


    <input 
    id="email"
    type="email"
    placeholder="Email">


    <input 
    id="password"
    type="password"
    placeholder="Password">


    <input 
    id="confirmPassword"
    type="password"
    placeholder="Confirm Password"
    style="display:none;">


    <button class="main-btn" id="authBtn">
        Enter MindBloom
    </button>


</div>

        <p class="switch-text">

            New here?
            <span>Create an account</span>

        </p>


    </div>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="auth.js"></script>


</body>

</html>
